          type: number
        locale:
          type: string
        locator:
          type: string
        longitude:
          type: number
        network_id:
          type: number
        no_circulation:
          type: boolean
        notes:
          type: string
        num_of_spots:
          type: number
        placing:
          maxLength: 1
          minLength: 1
          type: string
        product_id:
          type: number
        spot_time:
          type: number
        status:
          enum:
            - Active
