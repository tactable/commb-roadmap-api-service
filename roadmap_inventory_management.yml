  securitySchemes:
    auth0_jwk:
      flows:
        implicit:
          authorizationUrl: ''
          scopes:
            all: all
      type: oauth2
      x-google-audiences: AUTH0_AUDIENCE
      x-google-issuer: https://AUTH0_ACCOUNT_NAME.auth0.com/
      x-google-jwks_uri: https://AUTH0_ACCOUNT_NAME.auth0.com/.well-known/jwks.json
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: APIs used to programmatically manage inventory (add new, edit existing, delete etc.)
  title: Roadmap Inventory Management API
  version: 'beta-0.4'
paths:
  /face:
    post:
      operationId: FaceController_addInventoryToLocation
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
          description: ''
        '400':
          description: ''
        '403':
          description: ''
      tags: &ref_3
        - Inventory
      x-google-backend: &ref_1
        address: https://API_URL
        deadline: 360
        path_translation: APPEND_PATH_TO_ADDRESS
  /face/{id}:
    get:
      operationId: FaceController_getInventoryById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
          description: ''
        '403':
          description: ''
      tags: *ref_3
      x-google-backend: *ref_1
    patch:
      operationId: FaceController_updateInventory
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
          description: ''
        '201':
          description: The inventory has been updated Successfully.
        '400':
          description: ''
        '403':
          description: ''
      tags: *ref_3
      x-google-backend: *ref_1
  /face/{id}/media:
    post:
      operationId: FaceController_uploadMedia
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportFileDto'
        description: Media Asset Upload
        required: true
      responses:
        '201':
          description: ''
        '400':
          description: ''
      tags: *ref_3
      x-google-backend: *ref_1
  /locations:
    post:
      operationId: LocationController_createLocation
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationDto'
        required: true
      responses:
        '201':
          description: The location has been successfully created.
        '400':
          description: ''
        '403':
          description: ''
      tags: &ref_2
        - Locations
      x-google-backend: *ref_1
  /locations/{commb_location_id}:
    get:
      operationId: LocationController_getLocationById
      parameters:
        - in: path
          name: commb_location_id
          required: true
          schema:
            type: number
      responses:
        '200':
          description: The location has been retrieved successfully.
        '400':
          description: ''
        '403':
          description: ''
      tags: *ref_2
      x-google-backend: *ref_1
    patch:
      operationId: LocationController_updateLocation
      parameters:
        - in: path
          name: commb_location_id
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationDto'
          description: ''
        '201':
          description: The location has been updated successfully.
        '400':
          description: ''
        '403':
          description: ''
        '409':
          description: Location already exist with the provided commb location id
      tags: *ref_2
      x-google-backend: *ref_1
  /organizations:
    get:
      operationId: OrganizationController_getOrganizations
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrganizationDto'
                type: array
          description: ''
      tags:
        - Organizations
      x-google-backend: *ref_1
  /product:
    get:
      operationId: ProductController_getProducts
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductDTO'
                type: array
          description: ''
        '400':
          description: Bad Request.
        '403':
          description: Forbidden.
      tags: &ref_0
        - Product
      x-google-backend: *ref_1
security:
  - auth0_jwk: []
  - bearer: []
servers:
  - url: 'https://staging.roadmap.commb.ca/services'
    description: Staging Server
tags: []
